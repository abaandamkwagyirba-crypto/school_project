<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Portal</title>

    <style>
        body {
            background-color: #0c0b4b;
            color: #f2f3f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        #welcome-box {
            background: #0c0b4b; 
            padding: 3.5rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 440px;
            width: 90%;
            animation: containerSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        h3 {
            color: #5865f2;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 1rem;
            animation: textFadeIn 1.5s ease-in;
        }

        .welcome-subtitle {
            color: #393c3f;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        #button {
            display: block;
            text-decoration: none;
            color: #393c3f;
            background-color: #248046; 
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 12px rgba(36, 128, 70, 0.2);
        }

        #button:hover {
            transform: translateY(-2px);
            background-color: #1a6535;
            box-shadow: 0 6px 16px rgba(36, 128, 70, 0.4);
        }

        #button:active {
            transform: translateY(0);
        }

        @keyframes textFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes containerSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="welcome-box">
        <h3>WELCOME! ✨</h3>
        <p class="welcome-subtitle">Access your centralized staff administration records, student registrations, and financial tools.</p>
        
        <a href="/login" id="button">Want to Login? Press Here</a>
    </div>

</body>
</html>
