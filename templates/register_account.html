<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAFF ACCOUNT</title>

    <style>
        body {
            background-color: #0c0b4b;
            color: #f2f3f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        #registration_form_div {
            background: #0c0b4b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            max-width: 440px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            color: #b5bac1;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        select {
            background-color: #0c0b4b;
            border: 1px solid #3f4147;
            color: #ffffff;
            padding: 0.85rem;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #5865f2;
        }

        input[type="text"],
        input[type="password"] {
            background-color: #0c0b4b;
            border: 1px solid #3f4147;
            color: #ffffff;
            padding: 0.85rem;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #5865f2;
        }

        .form-actions {
            margin-top: 1.75rem;
        }

        #button {
            width: 100%;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background-color: #248046;
            color: #ffffff;
            transition: all 0.2s ease-in-out;
        }

        #button:hover {
            background-color: #1a6535;
            box-shadow: 0 4px 12px rgba(36, 128, 70, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div id="registration_form_div">
        <h1>STAFF ACCOUNT</h1>

        <form action="/submit_registration" method="POST">

            <div class="form-group">
                <label>User Type</label>
                <select name="role" required>
                    <option value="">Choose User Type</option>
                    <option value="HEAD TEACHER/PRINCIPAL">HEAD TEACHER/PRINCIPAL</option>
                    <option value="LECTURER">LECTURER</option>
                    <option value="ACCOUNTANT">ACCOUNTANT</option>
                </select>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button type="submit" id="button">SUBMIT</button>
            </div>

        </form>
    </div>
    
</body>
</html>
